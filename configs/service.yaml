# Параметры режима «огонь прежде гари» (fire-first) сервиса.
# Значения выбраны из физических соображений, не подгонялись под проверочные
# события; описание — service/README.md, раздел «Огонь прежде гари».
fire_first:
  # false — прежний режим: правило гари по всему участку без проверки огня (только для проверок).
  enabled: true

  evidence:
    # Окно одного запроса к NASA FIRMS Area API (предел API — 5 суток).
    window_days: 5
    # Спутники VIIRS; набор (архив SP или оперативный NRT) выбирается по
    # data_availability FIRMS для каждой даты.
    platforms: [SNPP, NOAA20, NOAA21]
    # Точки с низкой достоверностью (confidence = l) доказательством не считаются.
    min_confidence: [nominal, high]
    # В архиве SP FIRMS помечает статические промышленные источники типом 2.
    excluded_types: [2]

  persistent_sources:
    # Маска постоянных тепловых источников Краснодарского края и Адыгеи лежит в репозитории
    # (история FIRMS 2025-10-09…2026-10-09). Если файла нет и задан FIRMS_MAP_KEY, сервис строит
    # его при первом запуске в фоне по области region (FIRES_BUILD_MASK=0 отключает); вручную —
    # scripts/build_persistent_sources.py. Пока маски нет, в ответе — ограничение «маска не построена».
    files: [configs/persistent-sources/krasnodar_adygea.geojson]
    region: configs/regions/krasnodar_adygea.geojson
    # Точка ближе этого расстояния к постоянному источнику исключается.
    radius_m: 500
    # Построение маски: за сколько месяцев смотреть историю и сколько повторов
    # считать постоянным источником. Разные месяцы нужны, чтобы один
    # многодневный пожар не попал в маску.
    history_months: 12
    min_days: 5
    min_months: 3
    # Хотя бы одна детекция в декабре–феврале: промышленный источник горит круглый
    # год, а сезонные сельхозпалы — нет (тот же признак использовал эталон AF).
    require_winter: true
    cell_m: 400

  events:
    # Точки ближе этого расстояния объединяются в одно событие (пиксель VIIRS 375 м)...
    link_radius_m: 1000
    # ...если между их датами не больше этого числа дней: разные пожары на одном
    # месте за месяц — разные события со своей парой снимков.
    link_days: 2
    # Гарь должна быть там, где спутник видел огонь. Вокруг каждой термоточки
    # берётся пятно размером с пиксель VIIRS; детекция подтверждена, если модель
    # видит гарь хотя бы на этой доле пятна. Остаются только пятна гари,
    # пересекающие подтверждённую детекцию; соседнее убранное поле, лишь касающееся
    # точки, гарью не становится.
    detection_radius_m: 375
    min_scar_share: 0.25
    # Все детекции события ночные и мощность ниже порога — вероятно, тление
    # (солома, отходы), а не пожар с гарью; в ответе появляется оговорка.
    weak_night_frp_mw: 5
    # Промышленные объекты OpenStreetMap (заводы, НПЗ, факелы, свалки, ТЭЦ) ближе
    # этого расстояния к точкам огня: событие получает пометку, но не исключается.
    industrial_radius_m: 500
    # Сигнал подозрительности: если больше этой доли внешнего контура гари лежит на границе
    # зоны поиска (буфер ∩ область), гарь не замыкается вокруг очага — событие ненадёжно.
    # Площадь гари на одну термоточку выше этой — событие ненадёжно (гарь растеклась по соседним
    # полям). Порог — из 20 пожаров CLMS: максимум у подтверждённых событий 39,8 га, округлено вверх.
    max_area_per_point_ha: 40
    # Сезон уборки: в эти месяцы событие на пашне и водно-болотных угодьях надёжно, только если
    # проверка «убрано или выжжено» подтвердила гарь у самих точек огня.
    harvest_season_months: [9, 10]
    buffer_edge_share: 0.10
    # Если контур упирается в буфер, зона поиска расширяется по этим шагам (пока плиток не больше
    # max_tiles_per_event) и событие пересчитывается с той же парой снимков. Замкнулся — граница
    # больше не причина ненадёжности; упирается и дальше — гарь продолжается по полям.
    expand_buffer_m: [6000, 9000]
    # Пятна гари, разделённые валиками, дорогами и каналами уже этого расстояния, считаются
    # одним пятном при подсчёте обвода (иначе сотни чеков дают огромный суммарный периметр).
    buffer_edge_closing_m: 50
    # Модель гари запускается только внутри этого буфера вокруг точек события.
    buffer_m: 3000
    # Сколько событий обрабатывается за один запрос (по числу точек, по убыванию).
    max_events: 10
    # Событие больше этого числа плиток 10×10 км за запрос не обрабатывается.
    max_tiles_per_event: 9
    # Максимальная сторона области запроса в режиме fire-first, км.
    max_area_side_km: 60

  scenes:
    # Окна поиска снимков Sentinel-2 относительно первой/последней детекции.
    pre_window_days: 60
    post_window_days: 45
    # Классы SCL, считающиеся облаком: тень облака, облака средней/высокой
    # вероятности, перистые.
    cloud_classes: [3, 8, 9, 10]
    # Классы SCL «нет данных» и «дефектный пиксель».
    nodata_classes: [0, 1]
    max_cloud_fraction: 0.30
    max_nodata_fraction: 0.10
    # Сколько ближайших дат проверяется с каждой стороны события: при пролёте
    # Sentinel-2 раз в ~5 дней это покрывает окно поиска целиком.
    max_candidates: 12
    # Пара дальше этого разрыва помечается как ненадёжная: за несколько недель на
    # Кубани успевают убрать и вспахать поля, и они сливаются с гарью.
    reliable_gap_days: 15
    # Выбор пары: сначала надёжная по разрыву (не больше reliable_gap_days), среди них —
    # менее облачная (облачность сравнивается с этим шагом), затем более короткая. Если
    # надёжной пары нет — самая короткая. Прежнее правило «сначала облачность» брало
    # снимки на недели дальше при годных ближних (experiments/validation/landsat-availability.json).
    cloud_tie_step: 0.05
    # Доп. проверка облаков: синий канал B2 выше порога (отражение 0–1) при классе SCL
    # «почва/растительность/неклассифицировано» считается облаком. Sen2Cor иногда не
    # распознаёт плотное облако, а под ним NBR падает как на гари. На ясных снимках края
    # порог отмечает сотые доли процента пикселей (крыши теплиц).
    bright_cloud_b2: 0.15
    # Дымка у кандидата пары: 5-й процентиль синего канала B2 (отражение 0–1) на ясных по
    # SCL пикселях плиток. В ясную погоду тёмные объекты (вода, густая зелень, тени) в
    # синем канале не ярче ~0,03; дымку SCL не отмечает, а под ней NBR падает как на гари.
    # Снимок выше порога в пару не берётся (причина haze). Порог — из физики, не подбирался.
    haze_dark_b2: 0.04
    # Проверка времени изменения поля. Между снимками «до» и «после» бывают недели; снимки
    # между ними облачны для пары, но над частью пикселей ясны. Пиксель гарью не считается,
    # если потемнел ещё до огня (последний ясный снимок до огня уже тёмный) или сразу после
    # огня ещё не был тёмным (потемнел позже — уборка, вспашка). Порог — тот же, что у
    # контура гари. Сколько снимков смотреть с каждой стороны; 0 — выключено.
    # Проверка «убрано или выжжено»: пиксель гари, который посветлел во ВСЕХ видимых
    # каналах (B2, B3, B4) больше этого порога (отражение 0–1), — убранное поле, а не уголь.
    # Огонь затемняет синий и зелёный; красный у сгоревшей зелени может посветлеть, поэтому
    # по одному красному не судим. Порог — две типичные погрешности L2A (~0,01), не подбирался.
    harvest_brightening: 0.02
    # Проверка пройдена, если уборкой оказалось не больше этой доли изменений в буфере (и у самих
    # точек — для сезонного правила). Порог — из 20 пожаров CLMS: у настоящих пожаров не больше
    # 0,31 в буфере и 0,33 у точек (experiments/validation/point-signals.json), округлено вверх.
    harvest_pass_share: 0.35
    # Покровы ESA WorldCover, где бывают уборка и покос: пашня, травяные угодья, водно-болотные
    # (рисовые чеки, камыш). В лесу (бурая листва после огня в кронах) и у воды признак неприменим.
    harvest_landcover: [30, 40, 90]
    timing_check_scenes: 3
    # Край облака на промежуточном снимке — дымка, которую SCL не отмечает; маска облаков
    # там расширяется на это расстояние.
    timing_cloud_buffer_m: 200
  # Мониторинг: сервис сам опрашивает FIRMS по районам наблюдения и заводит оповещения
  # (колокольчик в интерфейсе). Фильтры точек и сборка очагов — те же, что выше.
  monitor:
    enabled: true
    # Период опроса. FIRMS публикует точку примерно через 3 часа после пролёта,
    # опрашивать чаще 15–30 минут бессмысленно.
    poll_minutes: 20
    # Какие точки считать свежими.
    lookback_hours: 24
    # Новые точки ближе этого расстояния к очагу, виденному за последние merge_hours,
    # дополняют его оповещение, а не создают новое.
    merge_radius_m: 2000
    merge_hours: 48
    max_zone_side_km: 500
