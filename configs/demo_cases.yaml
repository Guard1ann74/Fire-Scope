# Реальные случаи для показа: область и период, ничего заранее не нарисовано.
# Сервис считает их тем же кодом, что и любой запрос, и кеширует результат на
# диске (scripts/warm_demo_cases.py прогревает кеш до показа). Описание говорит,
# что именно показывает случай, включая ограничения.
cases:
  - id: anapa-2026-08
    name: Анапская равнина, конец августа 2026
    bbox: [37.10, 44.85, 37.60, 45.20]
    from: "2026-08-25"
    to: "2026-08-31"
    shows: >-
      Крупный ландшафтный пожар 29–31 августа (около 70 термоточек VIIRS, FRP до
      ~300 МВт); пара снимков с разрывом в несколько дней.
  - id: krasnodar-harvest-2026-09
    name: Окраина Краснодара в уборку, сентябрь 2026
    bbox: [38.889, 44.965, 39.114, 45.141]
    from: "2026-09-10"
    to: "2026-09-24"
    shows: >-
      Огня нет — гари нет: пустой результат и есть проверка. Кнопка «Сравнить»
      покажет, что модель без проверки огня выдала бы здесь ~1 200 га «гари» на
      убранных полях.
  - id: novotitarovskaya-2026-09
    name: Новотитаровская, сентябрь 2026
    bbox: [38.74, 45.13, 39.06, 45.33]
    from: "2026-09-10"
    to: "2026-09-24"
    shows: >-
      Слабый ночной огонь (вероятно тление) и длинный разрыв между снимками:
      оценка помечена ненадёжной и не входит в главную цифру; у второго события
      огонь есть, а гари в месте детекции нет.
  - id: east-2026-09
    name: Восток края, 12–14 сентября 2026
    bbox: [41.30, 44.85, 41.55, 44.98]
    from: "2026-09-10"
    to: "2026-09-16"
    shows: >-
      Крупный реальный пожар, но ясный снимок после него — только через 26 дней
      (облачность): площадь раздута уборкой полей и честно помечена ненадёжной.
  - id: rice-nw-krasnodar-2026-09
    name: Рисовые чеки северо-западнее Краснодара, сентябрь 2026
    bbox: [38.16, 45.13, 38.83, 45.62]
    from: "2026-09-11"
    to: "2026-09-25"
    shows: >-
      Сезон уборки риса и сжигания соломы: оценка требует подтверждения экспертами.
      Убранные чеки светлеют и вырезаются проверкой «убрано или выжжено» (фиолетовый
      слой на «Снимках до/после»); события, где гарь растекается по соседним чекам
      (больше 40 га на точку), помечены ненадёжными. Тёмные чеки без точек огня по
      видимым каналам не отличить от выжженных.
